[project]
name = "dashboard-mcp"
version = "0.1.0"
description = "MCP server for DVC Data Management Dashboard"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.0",
]

[project.scripts]
dashboard-mcp = "dashboard_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard_mcp"]
